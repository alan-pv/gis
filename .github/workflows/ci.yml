name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npm test
      - run: npm run build
      - run: npm run build:demo

  sidecar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # No pip install: the sidecar tests use only the standard library. They run
      # the server with a fake predictor and never import torch or laya, so there
      # is no need for the multi-GB ML dependencies in CI.
      - name: Sidecar unit tests
        run: python -m unittest discover -s sidecar/tests -t sidecar
